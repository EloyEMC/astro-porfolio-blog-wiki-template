name: Scheduled Cloudflare Pages publish

on:
  # Editorial dates use Europe/Madrid. GitHub Actions schedules use UTC:
  # 06:05 UTC covers CEST, and 07:05 UTC covers CET; the job guard selects only 08:00 local time.
  schedule:
    - cron: "5 6 * * *"
    - cron: "5 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-cloudflare-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Allow only the 08:00 Europe/Madrid window
        id: schedule_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          local_hour="$(TZ=Europe/Madrid date +'%H')"
          local_minute="$(TZ=Europe/Madrid date +'%M')"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" || ( "${local_hour}" == "08" && "${local_minute}" =~ ^0[0-9]$ ) ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Event ${EVENT_NAME} accepted at Europe/Madrid local time ${local_hour}:${local_minute}; continuing."
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Event ${EVENT_NAME} is outside the allowed Europe/Madrid window at ${local_hour}:${local_minute}; skipping."
          fi

      - name: Validate deploy hook secret
        if: steps.schedule_guard.outputs.publish == 'true'
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_DEPLOY_HOOK_URL}" ]]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK_URL is not configured. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Cloudflare Pages deploy hook secret is configured."

      - name: Trigger Cloudflare Pages deploy
        if: steps.schedule_guard.outputs.publish == 'true'
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --connect-timeout 30 \
            --max-time 300 \
            --request POST \
            "${CLOUDFLARE_DEPLOY_HOOK_URL}"
