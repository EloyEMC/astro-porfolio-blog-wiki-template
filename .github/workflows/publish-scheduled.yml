name: Scheduled Cloudflare Pages publish

on:
  # GitHub Actions schedules use UTC and may start late, so deployment must not
  # depend on the runner's local clock. This runs once daily around the morning
  # editorial window (08:05 CEST / 07:05 CET, subject to GitHub scheduling).
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-cloudflare-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate deploy hook secret
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_DEPLOY_HOOK_URL}" ]]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK_URL is not configured. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Cloudflare Pages deploy hook secret is configured."

      - name: Trigger Cloudflare Pages deploy
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --connect-timeout 30 \
            --max-time 300 \
            --request POST \
            "${CLOUDFLARE_DEPLOY_HOOK_URL}"
