<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"><title>Lámpara y luminaria</title><desc>Comparación entre una lámpara, que genera luz, y una luminaria, que la integra y distribuye.</desc><defs><linearGradient id="g"><stop stop-color="#e7b968"/><stop offset="1" stop-color="#f4d898"/></linearGradient></defs><rect width="960" height="540" fill="#0c1728"/><path d="M48 86H912M48 476H912" stroke="#263852"/><text x="48" y="56" fill="#e7b968" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">DIAGRAMA TÉCNICO · WIKI DE ILUMINACIÓN</text><text x="48" y="126" fill="#f4f0e8" font-family="Arial,sans-serif" font-weight="700" font-size="34">Lámpara y luminaria</text><circle cx="250" cy="285" r="58" fill="#172941" stroke="#e7b968" stroke-width="4"/><path d="M220 285q30-65 60 0l-10 35h-40zM230 335h40" fill="none" stroke="#e7b968" stroke-width="4"/><path d="M330 285H450" stroke="#e7b968" stroke-width="4"/><path d="M450 210h300v150H450z" fill="#172941" stroke="#55708f" stroke-width="4"/><path d="M490 260h220M490 300h180" stroke="#e7b968" stroke-width="4"/><text x="180" y="410" fill="#f4f0e8" font-family="Arial" font-size="20">FUENTE</text><text x="500" y="410" fill="#f4f0e8" font-family="Arial" font-size="20">SISTEMA ÓPTICO + CUERPO</text><text x="48" y="505" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Fuente reemplazable  /  LÁMPARA → LUMINARIA</text></svg>
